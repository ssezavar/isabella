---
# Fixture for the instruction overhead measurement. Three programs in one:
# a run of zero data byte commands, a run of one data byte commands, and a
# SLEEP_US loop. The testbench enters each at a known address with intr/iadr.
module: ctrl_overhead
inputs: |
  // no special inputs
outputs: |
  output reg [15:0] led
initial: |
  led = 0;
rst: |
  led <= 0;
hex_prefix: 8
commands:
- name: LED_BUMP
  databytes: 0
  verilog: led <= led + 1;
- name: LED_SET_LOW_BYTE
  databytes: 1
  verilog: led[7:0] <= data;
- name: LED_DONE
  databytes: 0
  verilog: led <= 16'hffff;
program: |
  # 0: ten commands with no data byte, then stop
  zero_run: LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_BUMP
            LED_DONE
            NULL_CMD
  # 12: ten commands that each take one data byte, then stop
  one_run:  LED_SET_LOW_BYTE
            0x01
            LED_SET_LOW_BYTE
            0x02
            LED_SET_LOW_BYTE
            0x03
            LED_SET_LOW_BYTE
            0x04
            LED_SET_LOW_BYTE
            0x05
            LED_SET_LOW_BYTE
            0x06
            LED_SET_LOW_BYTE
            0x07
            LED_SET_LOW_BYTE
            0x08
            LED_SET_LOW_BYTE
            0x09
            LED_SET_LOW_BYTE
            0x0A
            LED_DONE
            NULL_CMD
  # 34: a sleep loop, ten iterations of SLEEP_US 5 measured by the testbench
  sleep_run: SLEEP_US
             0x05
             LED_BUMP
             JUMP
             sleep_run
...
